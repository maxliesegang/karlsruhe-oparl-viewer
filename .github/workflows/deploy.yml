name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [main]
  # Sent by karlsruhe-oparl-syndication's feed workflow after it pushes new data,
  # so the site follows the data without matching its schedule.
  repository_dispatch:
    types: [syndication-updated]
  # Safety net for a lost or failed dispatch: the site is never more than a day
  # behind. Usually a no-op thanks to the successful-build marker below. Odd
  # minute to avoid the start-of-hour Actions peak.
  schedule:
    - cron: "47 4 * * *"
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow the workflow to clone the repositories and create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-build
      cancel-in-progress: true
    outputs:
      data-revision: ${{ steps.data-revision.outputs.revision }}
      should-deploy: ${{ steps.changes.outputs.should-deploy }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Resolve council data revision
        id: data-revision
        run: |
          revision=""
          for attempt in 1 2 3; do
            if revision=$(git ls-remote https://github.com/maxliesegang/karlsruhe-oparl-syndication.git refs/heads/main | cut -f1) && [[ -n "$revision" ]]; then
              break
            fi
            echo "Could not resolve council data revision (attempt $attempt of 3)."
            if (( attempt < 3 )); then
              sleep $((attempt * 2))
            fi
          done
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # Scheduled and dispatched runs are often no-ops (the cron after a dispatch
      # already deployed, or a dispatch whose data a newer run already built).
      # Remember successful viewer/data revision pairs so they can skip the large
      # data checkout and full static rebuild.
      - name: Check for an already successful build
        id: successful-build
        if: github.event_name == 'schedule' || github.event_name == 'repository_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .build-markers
          key: successful-build-${{ github.sha }}-${{ steps.data-revision.outputs.revision }}
          lookup-only: true

      - name: Decide whether to build
        id: changes
        run: |
          if [[ "${{ steps.successful-build.outputs.cache-hit }}" == "true" ]]; then
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            echo "Viewer and council data revisions were already deployed; skipping."
          else
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # No actions/configure-pages step: astro.config.mjs hardcodes `site` and
      # `base`, so its outputs go unused and it only adds a download that can
      # fail during job setup.
      - name: Checkout council data
        if: steps.changes.outputs.should-deploy == 'true'
        uses: actions/checkout@v7
        with:
          repository: maxliesegang/karlsruhe-oparl-syndication
          ref: ${{ steps.data-revision.outputs.revision }}
          path: syndication-data
          sparse-checkout: docs
          fetch-depth: 1

      - name: Setup Node
        if: steps.changes.outputs.should-deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.should-deploy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build site
        if: steps.changes.outputs.should-deploy == 'true'
        run: npm run build:quiet

      - name: Verify build output
        if: steps.changes.outputs.should-deploy == 'true'
        run: npm run build:verify

      - name: Upload Pages artifact
        if: steps.changes.outputs.should-deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Mark revision pair as successfully deployed
        run: mkdir -p .build-markers && touch .build-markers/success

      - name: Save successful deployment marker
        uses: actions/cache/save@v6
        with:
          path: .build-markers
          key: successful-build-${{ github.sha }}-${{ needs.build.outputs.data-revision }}
